name: Validate world state

on:
  pull_request:
    paths:
      - agent-manifest.json
      - experiments/world-state.json
      - scripts/validate-world-state.js
      - scripts/validate-world-state.test.js
      - scripts/council-perception.test.js
      - scripts/council-consequence.test.js
      - scripts/daily-evolution.js
      - scripts/agent-council.js
      - experiments/council-perception.js
      - experiments/agent-theatre.js
      - index.html
      - .github/workflows/validate-world-state.yml
  push:
    branches: [main]
    paths:
      - agent-manifest.json
      - experiments/world-state.json
      - scripts/validate-world-state.js
      - scripts/validate-world-state.test.js
      - scripts/council-perception.test.js
      - scripts/council-consequence.test.js
      - scripts/daily-evolution.js
      - scripts/agent-council.js
      - experiments/council-perception.js
      - experiments/agent-theatre.js
      - index.html
      - .github/workflows/validate-world-state.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run validator regression tests
        run: node --test scripts/validate-world-state.test.js
      - name: Test council knowledge boundary
        run: node --test scripts/council-perception.test.js
      - name: Test finite council consequences
        run: node --test scripts/council-consequence.test.js
      - name: Validate canonical world state
        run: node scripts/validate-world-state.js
